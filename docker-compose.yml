services:
  omr:
    build:
      context: .
      dockerfile: Dockerfile
    image: ohoooho-model-router:local
    ports:
      # Publish only Nginx. Internal web/gateway listeners stay inside the container.
      - "3458:8080"
    volumes:
      - omr-data:/data
    restart: unless-stopped

volumes:
  omr-data:
